# ==============================================================================
# CẤU HÌNH NGINX CHO EDUCRM SIS (VUE 3 SPA + LARAVEL API GỘP 1 PORT)
# Đường dẫn copy file này vào: /etc/nginx/sites-available/sis
# Kích hoạt: sudo ln -s /etc/nginx/sites-available/sis /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    server_name localhost _; # Hoặc tên miền của bạn nếu có

    # Thay đường dẫn /path/to/SIS bằng đường dẫn thực tế trên laptop Linux của bạn
    # Ví dụ: /home/tenuser/SIS
    set $base_dir "/var/www/SIS";

    # Giao diện Vue 3 (Thư mục dist sau khi build)
    root $base_dir/frontend/dist;
    index index.html;

    client_max_body_size 50M;

    # Gzip nén dữ liệu giúp tải trang siêu nhanh
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Định tuyến các API sang Laravel Backend
    location /api {
        root $base_dir/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $base_dir/backend/public/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }

    # 2. Xử lý file tĩnh storage (ảnh đại diện, hóa đơn, học cụ)
    location /storage {
        alias $base_dir/backend/storage/app/public;
        try_files $uri $uri/ =404;
    }

    # 3. Định tuyến SPA Vue 3 (HTML5 History Mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tắt log các file favicon và robots để đỡ tốn dung lượng ổ cứng
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
